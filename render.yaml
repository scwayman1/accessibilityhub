services:
  - type: web
    name: accessibility-hub-staging
    # Full document toolchain in one image (Dockerfile): PdfCraft, veraPDF,
    # WeasyPrint's libraries, poppler, qpdf, tesseract. CI builds and
    # smoke-tests the same image (.github/workflows/docker.yml).
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Starter is Render's smallest instance type that can carry a disk.
    plan: starter
    # The persistent disk is the pilot's storage: SQLite records, document
    # versions, and thumbnails under /var/data (HUB_DATA_DIR) survive deploys.
    # A disk pins the service to one instance (deploys briefly restart it).
    disk:
      name: hub-data
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: HUB_ENV
        value: staging
      - key: HUB_STAGING_ACCESS_CODE
        sync: false
      - key: HUB_SESSION_SECRET
        sync: false
      # Dashboard-managed opt-in. Only the exact value "true" opens the
      # bundled-synthetic-fixture route in hosted staging; leave unset to keep
      # hosted document creation closed. It never enables uploads on its own
      # (HUB_ACCEPT_UPLOADS does).
      - key: HUB_ALLOW_HOSTED_SYNTHETIC
        sync: false
      # Pilot hardening: the workspace requires sign-in. Only the exact value
      # "true" would reopen it; keep it off for anything beyond a public demo.
      - key: HUB_PUBLIC_ACCESS
        value: "false"
      # Accessible HTML + tagged PDF downloads: open for the Coastline pilot.
      # Only the exact value "true" opens them; the Docker image carries the
      # libraries producing PDFs needs.
      - key: HUB_ENABLE_PRODUCE
        value: "true"
      # Real PDF uploads for signed-in users (the commercial product). Only
      # the exact value "true" opens them, and never while HUB_PUBLIC_ACCESS
      # is "true". Files live on the disk above.
      - key: HUB_ACCEPT_UPLOADS
        value: "true"
      # Every document (original and copies) is deleted automatically this
      # many days after upload; each deletion is audited.
      - key: HUB_RETENTION_DAYS
        value: "365"
      - key: HUB_DATA_DIR
        value: /var/data
      # Shows a disabled "Sign in with your Coastline Microsoft account"
      # placeholder above the access code; no directory is contacted.
      - key: HUB_SSO_PROVIDER
        value: entra
      - key: HUB_PRIVATE_OBJECT_STORAGE
        sync: false
      - key: HUB_MALWARE_SCAN_GATE
        sync: false
      - key: HUB_WORKER_ISOLATION_ATTESTATION
        sync: false
      - key: HUB_TENANT_AUTH_ISSUER
        sync: false
      - key: HUB_LIFECYCLE_POLICY_ID
        sync: false
      - key: HUB_AUDIT_SINK
        sync: false
