services:
  - type: web
    name: accessibility-hub-staging
    runtime: python
    # The hosted runtime has no qpdf, veraPDF (Docker), or tesseract — the
    # build installs Python packages only. Reviews still complete: the review
    # discloses each missing check under "Review completeness" instead of
    # presenting a partial result as a full one.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT service.wsgi:application
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: HUB_ENV
        value: staging
      - key: HUB_STAGING_ACCESS_CODE
        sync: false
      - key: HUB_SESSION_SECRET
        sync: false
      # Dashboard-managed opt-in. Only the exact value "true" opens the
      # bundled-synthetic-fixture route in hosted staging; leave unset to keep
      # hosted document creation closed. It never enables uploads or real intake.
      - key: HUB_ALLOW_HOSTED_SYNTHETIC
        sync: false
      - key: HUB_PUBLIC_ACCESS
        value: true
      - key: HUB_PRIVATE_OBJECT_STORAGE
        sync: false
      - key: HUB_MALWARE_SCAN_GATE
        sync: false
      - key: HUB_WORKER_ISOLATION_ATTESTATION
        sync: false
      - key: HUB_TENANT_AUTH_ISSUER
        sync: false
      - key: HUB_LIFECYCLE_POLICY_ID
        sync: false
      - key: HUB_AUDIT_SINK
        sync: false
